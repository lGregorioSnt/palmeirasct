<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sociedade Esportiva Palmeiras</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fundo da página com as cores do Palmeiras */
        body {
            background-color: #006437; /* Verde oficial do Palmeiras */
            background-image: linear-gradient(135deg, #006437 0%, #00381e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Caixa branca central */
        .login-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 6px solid #c5a059; /* Detalhe em dourado */
        }

        /* Escudo / Logo */
        .logo {
            width: 85px;
            height: 85px;
            margin-bottom: 15px;
        }

        /* Títulos */
        h2 {
            color: #006437;
            margin-bottom: 5px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Campos do formulário */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #006437;
        }

        /* Botão de Entrar */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #006437;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #004b29;
        }

        /* Links inferiores */
        .links {
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #006437;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .links span {
            color: #ccc;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Escudo oficial via Wikimedia -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg" alt="Escudo do Palmeiras" class="logo">
        
        <h2>Avanti Palestra</h2>
        <p class="subtitle">Acesse sua conta de Sócio Torcedor</p>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="cpf">CPF ou E-mail</label>
                <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF ou e-mail" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="links">
            <a href="#">Esqueci minha senha</a>
            <span>|</span>
            <a href="#">Seja Sócio Avanti</a>
        </div>
    </div>

</body>
</html>
